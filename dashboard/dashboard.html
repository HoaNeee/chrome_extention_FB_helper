<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="./libs/quill.snow.css" />
  <link rel="stylesheet" href="./libs/toastify.min.css">


</head>

<body apply-animation="true">
  <header class="header">
    <div style="flex: 1;">
      <div class="tm_logo"></div>
    </div>
    <div style="display: flex; gap: 24px; align-items: center; padding: 0 12px 0 18px;">
      <div>
        <label class="switch">
          <input type="checkbox" id="tm_switch-status-tool-at-header" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div style="cursor: pointer; display: flex; align-items: center; justify-content: center;"
        id="tm_btn-change-theme" title="Change theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="24" height="24" class="tm_svg">
          <path
            d="M512 320C512 214 426 128 320 128L320 512C426 512 512 426 512 320zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320z" />
        </svg>
      </div>
      <div title="Change language">
        <select id="tm_select-language" style="cursor: pointer; outline: none; border: none">
          <option value="vi">VI</option>
          <option value="en">EN</option>
        </select>
      </div>
      <div class="auth-container">
        <button id="tm_btn-login" title="Login">Login</button>
        <div id="tm_user-info" style="display: none; cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="20" height="20" class="tm_svg">
            <path fill="rgb(0, 0, 0)"
              d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z" />
          </svg>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="tm_root"></div>
  </main>
  <footer>Developed by Hoane</footer>
  <script src="./libs/quill.js"></script>
  <script src="./libs/sweetalert2@11.js"></script>
  <script src="./libs/toastify-js.js"></script>
  <script src="./libs/popper.min.js"></script>
  <script src="./libs/tippy-bundle.umd.min.js"></script>
  <script src="dashboard.js" type="module"></script>
</body>

</html>
